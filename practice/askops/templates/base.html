<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AskOps{% endblock %}</title>
  {# htmx is vendored in askops/static, so the page works with no CDN access #}
  <script src="/static/htmx.min.js"></script>
  <style>
    :root { --bg:#f6f7f9; --panel:#fff; --line:#dde1e7; --fg:#1d2430; --dim:#5b6675; --acc:#b4621c; --bad:#b3261e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--fg); }
    header { background: #1d2430; color: #fff; padding: 14px 24px; display: flex; align-items: baseline; gap: 14px; }
    header h1 { margin: 0; font-size: 22px; } header span { color: #aab4c2; font-size: 14px; }
    main { max-width: 1040px; margin: 20px auto; padding: 0 16px; display: grid; gap: 18px; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; }
    h2 { margin: 0 0 10px; font-size: 17px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input, select, button { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 5px; }
    input[name=q], input[name=title] { flex: 1; min-width: 200px; }
    button { background: var(--acc); color: #fff; border-color: var(--acc); cursor: pointer; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--dim); font-weight: 600; }
    .hit { border-left: 3px solid var(--acc); padding: 6px 12px; margin: 10px 0; }
    .hit b { display: block; } .hit ol { margin: 6px 0 0; color: var(--dim); }
    .score { color: var(--dim); font-size: 13px; }
    .muted { color: var(--dim); }
    .error, .error td { color: var(--bad); }
    .sev-high, .sev-critical { color: var(--bad); font-weight: 600; }
  </style>
</head>
<body>
  <header><h1>AskOps</h1><span>runbooks, incidents, and a way to ask</span></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
